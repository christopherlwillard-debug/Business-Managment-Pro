        after: { type: string }
      required: [field, label, before, after]

    ProductionComponent:
      type: object
      properties:
        id: { type: integer, nullable: true }
        jobId: { type: integer }
        businessId: { type: integer, nullable: true }
        componentKey:
          type: string
          enum: [interior_finish, siding, plumbing, skirting, custom]
        componentInstanceKey: { type: string }
        componentLabel: { type: string }
        variant:
          type: string
          enum: [vog, hybrid, drywall]
          nullable: true
        sourceServiceIds:
          type: array
          items: { type: integer }
        sourceServices:
          type: array
          items:
            type: object
            additionalProperties: true
        snapshotVersion: { type: integer }
        status:
          type: string
          enum: [planned, in_progress, paused, completed, not_applicable]
        expectedLaborHours: { type: number, nullable: true }
        expectedDurationDays: { type: number, nullable: true }
        expectedCrewSize: { type: number, nullable: true }
        checklistContext: { type: object, nullable: true, additionalProperties: true }
        materialContext: { type: object, nullable: true, additionalProperties: true }
        pricingContext: { type: object, nullable: true, additionalProperties: true }
        knowledgeContext: { type: object, nullable: true, additionalProperties: true }
        capturedAt: { type: string, nullable: true }
        supersededAt: { type: string, nullable: true }
        persisted: { type: boolean }
        previousSnapshotVersion: { type: integer, nullable: true }
        changesFromPrevious:
          type: array
          items:
            $ref: "#/components/schemas/ProductionComponentChange"
      required:
