openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Contractor Management App API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: jobs
    description: Job management
  - name: invoices
    description: Invoice management
  - name: material-lists
    description: Job material lists and invoice assignments
  - name: expenses
    description: Expense management
  - name: mileage
    description: Mileage tracking
  - name: subcontractors
    description: Subcontractor management
  - name: estimates
    description: Job estimating
  - name: daily-logs
    description: Daily job logs
  - name: settings
    description: App settings
  - name: reports
    description: Reports and analytics
  - name: clients
    description: Client management
  - name: uploads
    description: File uploads
  - name: Storage
    description: Object storage upload and serving endpoints.
  - name: Auth
    description: Browser and mobile authentication endpoints.
  - name: portal
    description: Subcontractor self-service portal (public, token-based)
paths:
  /auth/user:
    get:
      tags: [Auth]
      operationId: getCurrentAuthUser
      summary: Get the currently authenticated user
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      responses:
        '200':
          description: Auth status resolved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthUserEnvelope'
  /login:
    get:
      tags: [Auth]
      operationId: beginBrowserLogin
      summary: Start the browser OIDC login flow
      parameters:
        - name: returnTo
          in: query
          required: false
          description: Relative path to redirect to after login (must start with `/`). Defaults to `/`.
          schema:
            type: string
      responses:
        '302':
          description: Redirect to the OIDC authorization endpoint.
  /callback:
    get:
      tags: [Auth]
      operationId: handleBrowserLoginCallback
      summary: Complete the browser OIDC login flow
      parameters:
        - name: code
          in: query
          required: false
          schema:
            type: string
        - name: state
          in: query
          required: false
          schema:
            type: string
        - name: iss
          in: query
          required: false
          schema:
            type: string
            format: uri
      responses:
        '302':
          description: Redirect to the `returnTo` path on success (defaults to `/`) or `/api/login` on failure.
  /logout:
    get:
      tags: [Auth]
      operationId: logoutBrowserSession
      summary: Clear the session and begin OIDC logout
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      responses:
        '302':
          description: Redirect to the OIDC provider logout URL.
  /mobile-auth/token-exchange:
    post:
      tags: [Auth]
      operationId: exchangeMobileAuthorizationCode
      summary: Exchange a mobile OIDC code for a session token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MobileTokenExchangeRequest'
      responses:
        '200':
          description: Session created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MobileTokenExchangeSuccess'
        '400':
          description: Missing or invalid required fields.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Token did not contain usable claims.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Token exchange failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /mobile-auth/logout:
    post:
      tags: [Auth]
      operationId: logoutMobileSession
      summary: Delete a mobile session token
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
      responses:
        '200':
          description: Logout processed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogoutSuccess'
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # CLIENTS
  /clients:
    get:
      operationId: listClients
      tags: [clients]
      summary: List all clients
      parameters:
        - name: businessId
          in: query
          description: Canonical business owner; legacy business_line rows matching the business remain visible
          schema:
            type: integer
        - name: businessLine
          in: query
          description: Explicit operating division; takes precedence over legal-owner rollup
          schema:
            type: string
      responses:
        "200":
          description: List of clients
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Client"
    post:
      operationId: createClient
      tags: [clients]
      summary: Create a client
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateClientRequest"
      responses:
        "201":
          description: Created client
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Client"

  /clients/{id}:
    get:
      operationId: getClient
      tags: [clients]
      summary: Get a client
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Client
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Client"
    put:
      operationId: updateClient
      tags: [clients]
      summary: Update a client
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateClientRequest"
      responses:
        "200":
          description: Updated client
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Client"
    delete:
      operationId: deleteClient
      tags: [clients]
      summary: Delete a client
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  # JOBS
  /jobs:
    get:
      operationId: listJobs
      tags: [jobs]
      summary: List all jobs
      parameters:
        - name: status
          in: query
          schema:
            type: string
        - name: clientId
          in: query
          schema:
            type: integer
        - name: businessId
          in: query
          description: Business or legal owner to scope the job list
          schema:
            type: integer
        - name: businessLine
          in: query
          description: Explicit operating division filter
          schema:
            type: string
      responses:
        "200":
          description: List of jobs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Job"
    post:
      operationId: createJob
      tags: [jobs]
      summary: Create a job
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateJobRequest"
      responses:
        "201":
          description: Created job
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"

  /jobs/ready-to-start:
    get:
      operationId: getReadyToStartJobs
      tags: [jobs]
      summary: Get open jobs without a definite start date and their production readiness details
      parameters:
        - name: businessId
          in: query
          schema: { type: integer }
      responses:
        "200":
          description: Jobs ready to start or waiting on a dependency
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadyToStartResponse"

  /jobs/{id}/start:
    post:
      operationId: startJob
      tags: [jobs]
      summary: Assign an actual start date and move a ready job into the active schedule
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartJobRequest"
      responses:
        "200":
          description: Job moved into the active schedule
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"

  /jobs/{id}/profit:
    get:
      operationId: getJobProfit
      tags: [jobs]
      summary: Get the canonical profit calculation for one job
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Canonical job profit response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobProfitResponse"

  /jobs/{id}/production-components:
    get:
      operationId: getJobProductionComponents
      tags: [jobs]
      summary: Get the job-specific production components
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Production component snapshots
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProductionComponent"
    post:
      operationId: snapshotJobProductionComponents
      tags: [jobs]
      summary: Create or refresh job-specific production component snapshots
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "201":
          description: Production component snapshots
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProductionComponent"

  /jobs/{id}/production-components/history:
    get:
      operationId: getJobProductionComponentHistory
      tags: [jobs]
      summary: Get current and superseded job-specific production component snapshots
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Production component snapshot history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProductionComponent"

  /jobs/{id}/production-components/status:
    patch:
      operationId: updateJobProductionComponentStatus
      tags: [jobs]
      summary: Update one production component status
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProductionComponentStatusRequest"
      responses:
        "200":
          description: Updated production component
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductionComponent"

  /jobs/{id}/component-work-sessions:
    get:
      operationId: listJobComponentWorkSessions
      tags: [jobs]
      summary: List raw component work sessions for a job
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
        - name: businessId
          in: query
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Component work sessions and exact-decimal totals
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComponentWorkSessionsResponse"
        "400":
          description: Invalid business scope
        "404":
          description: Job not found
    post:
      operationId: createJobComponentWorkSession
      tags: [jobs]
      summary: Record raw work for an approved job production component
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
        - name: businessId
          in: query
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateComponentWorkSessionRequest"
      responses:
        "201":
          description: Created component work session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComponentWorkSession"
        "400":
          description: Invalid work-session input or business scope
        "404":
          description: Job, component, or worker not found
        "409":
          description: Closed job or concurrent component snapshot change

  /jobs/{id}/component-work-sessions/{sessionId}:
    patch:
      operationId: updateJobComponentWorkSession
      tags: [jobs]
      summary: Correct a raw component work session
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
        - name: sessionId
          in: path
          required: true
          schema: { type: integer }
        - name: businessId
          in: query
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateComponentWorkSessionRequest"
      responses:
        "200":
          description: Updated component work session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComponentWorkSession"
        "400":
          description: Invalid work-session input or business scope
        "404":
          description: Job, component, worker, or session not found
        "409":
          description: Closed job or concurrent component snapshot change

  /jobs/profit-summary:
    get:
      operationId: getJobsProfitSummary
      tags: [jobs]
      summary: Get canonical profit calculations for multiple jobs
      parameters:
        - name: jobIds
          in: query
          required: true
          description: Comma-separated job IDs
          schema:
            type: string
      responses:
        "200":
          description: Canonical profit response keyed by job ID
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  $ref: "#/components/schemas/JobProfitSummaryResponse"

  /jobs/trim-out-catalog:
    get:
      operationId: getTrimOutCatalog
      tags: [jobs]
      summary: Get paginated completed-home summaries for the Trim-Out Catalog
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: pageSize
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
        - name: manufacturerId
          in: query
          schema: { type: integer }
        - name: modelId
          in: query
          schema: { type: integer }
        - name: businessId
          in: query
          schema: { type: integer }
        - name: businessLine
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Trim-Out Catalog hierarchy and paginated home summaries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrimOutCatalogResponse"

  /jobs/{id}/invoice-draft:
    get:
      operationId: getJobInvoiceDraft
      tags: [jobs]
      summary: Get a pre-filled invoice draft for a completed job
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Invoice draft pre-filled from job data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvoiceDraft"

  /jobs/{id}/readiness:
    get:
      operationId: listJobReadinessConditions
      tags: [jobs]
      summary: List a job's internal readiness condition history
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Readiness condition history
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/JobReadinessCondition' }
    post:
      operationId: createJobReadinessCondition
      tags: [jobs]
      summary: Add an internal readiness blocker
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/JobReadinessConditionInput' }
      responses:
        '201':
          description: Blocker created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobReadinessCondition' }
  /jobs/{id}/readiness/{conditionId}/clear:
    post:
      operationId: clearJobReadinessCondition
      tags: [jobs]
      summary: Clear an internal readiness blocker without deleting history
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
        - name: conditionId
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Cleared blocker
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobReadinessCondition' }
  /jobs/{jobId}/checklist/sections/{sectionId}/complete:
    post:
      operationId: completeProductionScopeSection
      tags: [jobs]
      summary: Complete or reopen an applied production checklist section
      parameters:
        - name: jobId
          in: path
          required: true
          schema: { type: integer }
        - name: sectionId
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProductionScopeSectionInput' }
      responses:
        '200':
          description: Applied checklist updated

  /jobs/{id}:
    get:
      operationId: getJob
      tags: [jobs]
      summary: Get a job
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Job
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
    put:
      operationId: updateJob
      tags: [jobs]
      summary: Update a job
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateJobRequest"
      responses:
        "200":
          description: Updated job
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
    delete:
      operationId: deleteJob
      tags: [jobs]
      summary: Delete a job
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  # MATERIAL LIST INVOICE ASSIGNMENT
  /material-lists/{id}/attach-to-invoice:
    post:
      operationId: updateMaterialListInvoiceAssignment
      tags: [material-lists]
      summary: Attach, reassign, or detach a material list from an invoice
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MaterialListInvoiceAssignmentInput"
      responses:
        "200":
          description: Material list invoice assignment result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MaterialListInvoiceAssignmentResult"
        "400":
          description: Invalid assignment request
        "404":
          description: Material list or invoice not found
        "409":
          description: Invoice status, client, or business does not allow assignment
  /material-lists/{id}/invoice-assignment-history:
    get:
      operationId: getMaterialListInvoiceAssignmentHistory
      tags: [material-lists]
      summary: Get assignment history for a material list
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Material list invoice assignment history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MaterialListInvoiceAssignmentHistoryEvent"
        "404":
          description: Material list not found

  # INVOICES
  /invoices:
    get:
      operationId: listInvoices
      tags: [invoices]
      summary: List all invoices
      parameters:
        - name: businessId
          in: query
          schema:
            type: integer
        - name: businessLine
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
        - name: clientId
          in: query
          schema:
            type: integer
        - name: startDate
          in: query
          schema:
            type: string
        - name: endDate
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of invoices
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Invoice"
    post:
      operationId: createInvoice
      tags: [invoices]
      summary: Create an invoice
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateInvoiceRequest"
      responses:
        "201":
          description: Created invoice
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invoice"

  /invoices/{id}:
    get:
      operationId: getInvoice
      tags: [invoices]
      summary: Get an invoice
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Invoice
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invoice"
    put:
      operationId: updateInvoice
      tags: [invoices]
      summary: Update an invoice
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateInvoiceRequest"
      responses:
        "200":
          description: Updated invoice
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invoice"
    delete:
      operationId: deleteInvoice
      tags: [invoices]
      summary: Delete an invoice
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /invoices/{id}/status:
    patch:
      operationId: updateInvoiceStatus
      tags: [invoices]
      summary: Update invoice status
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  enum: [draft, sent, paid, overdue, cancelled]
              required: [status]
      responses:
        "200":
          description: Updated invoice
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invoice"

  /invoices/{id}/void:
    post:
      operationId: voidInvoice
      tags: [invoices]
      summary: Void an invoice while retaining its audit record
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Voided invoice
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invoice"

  /invoices/{id}/communications:
    get:
      operationId: listInvoiceCommunications
      tags: [invoices]
      summary: List chronological invoice communication and delivery events
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Invoice communication events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/InvoiceCommunicationEvent"
    post:
      operationId: prepareInvoiceCommunication
      tags: [invoices]
      summary: Create a pending browser invoice communication attempt
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PrepareInvoiceCommunicationRequest"
      responses:
        "201":
          description: Pending communication event
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvoiceCommunicationEvent"

  /invoices/{id}/communications/{eventId}/finalize:
    post:
      operationId: finalizeInvoiceCommunication
      tags: [invoices]
      summary: Finalize a pending invoice communication attempt
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: eventId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FinalizeInvoiceCommunicationRequest"
      responses:
        "200":
          description: Finalized communication event
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvoiceCommunicationEvent"

  /invoices/tax-report:
    get:
      operationId: getInvoiceTaxReport
      tags: [invoices]
      summary: Get invoice tax report (jobs, dates, amounts, locations)
      parameters:
        - name: businessId
          in: query
          schema:
            type: integer
        - name: businessLine
          in: query
          schema:
            type: string
