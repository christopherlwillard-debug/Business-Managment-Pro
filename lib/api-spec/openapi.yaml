  # PORTAL — public, token-based
  /portal/check-session:
    post:
      operationId: portalCheckSession
      tags: [portal]
      summary: Check whether a PIN session is valid for a portal token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                token: { type: string }
              required: [token]
      responses:
        "200":
          description: Session status
          content:
            application/json:
              schema:
                type: object
                properties:
                  valid: { type: boolean }
                  pinSet: { type: boolean }
                required: [valid, pinSet]

  /portal/set-pin:
    post:
      operationId: portalSetPin
      tags: [portal]
      summary: Set the portal PIN for the first time
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                token: { type: string }
                pin: { type: string, minLength: 4, maxLength: 6, pattern: '^\d{4,6}$' }
              required: [token, pin]
      responses:
        "200":
          description: PIN set successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                required: [success]
        "400":
          description: Validation error or PIN already set

  /portal/verify-pin:
    post:
      operationId: portalVerifyPin
      tags: [portal]
      summary: Verify the portal PIN and issue a session cookie
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                token: { type: string }
                pin: { type: string, minLength: 4, maxLength: 6, pattern: '^\d{4,6}$' }
              required: [token, pin]
      responses:
        "200":
          description: PIN verified; HMAC-signed session cookie set
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                required: [success]
        "401":
          description: Incorrect PIN
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string }
                  attemptsLeft: { type: integer }
                  locked: { type: boolean }
        "429":
          description: Locked out after too many attempts

  /subcontractors/{id}/reset-portal-pin:
    post:
      operationId: resetPortalPin
      tags: [subcontractors]
      summary: Admin — clear a subcontractor's portal PIN
      parameters:
        - name: id
