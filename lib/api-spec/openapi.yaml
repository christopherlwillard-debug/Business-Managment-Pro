    get:
      operationId: getComplianceReport
      tags: [reports]
      summary: Get compliance alerts (1099, mileage, licenses)
      responses:
        "200":
          description: Compliance report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComplianceReport"

  # FILE UPLOADS
  /uploads:
    post:
      operationId: uploadFile
      tags: [uploads]
      summary: Upload a file
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "200":
          description: Uploaded file info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadedFile"

  /storage/uploads/request-url:
    post:
      operationId: requestUploadUrl
      tags: [Storage]
      summary: Request a presigned URL for file upload
      description: |
        Returns a presigned GCS URL for direct upload. The client sends JSON
        metadata here, then uploads the file directly to the returned URL.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadUrlRequest"
      responses:
        "200":
          description: Presigned upload URL generated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadUrlResponse"
        "400":
          description: Missing or invalid required fields.
        "500":
          description: Failed to generate upload URL.

  /storage/public-objects/{filePath}:
    get:
      operationId: getPublicObject
      tags: [Storage]
      summary: Serve a public asset from PUBLIC_OBJECT_SEARCH_PATHS
      parameters:
        - name: filePath
          in: path
          required: true
          schema:
            type: string
          description: Relative file path within the public search paths.
      responses:
        "200":
          description: Object content streamed with correct Content-Type.
          content:
            "*/*":
              schema:
                type: string
                format: binary
        "404":
          description: File not found

  /storage/objects/{objectPath}:
    get:
      operationId: getStorageObject
      tags: [Storage]
      summary: Serve an object entity from PRIVATE_OBJECT_DIR
      parameters:
        - name: objectPath
          in: path
          required: true
          schema:
            type: string
          description: Object path within the private object dir (e.g. uploads/some-uuid)
      responses:
        "200":
          description: Object content streamed with correct Content-Type.
          content:
            "*/*":
              schema:
                type: string
                format: binary
        "404":
          description: Object not found

  # NOTE: /route-stops, /prospects, /assets paths are intentionally omitted from
  # generated paths because they are served by hand-written hooks in
  # lib/api-client-react/src/hooks/ (useProspects.ts, etc.) which add proper
  # react-query cache invalidation. Their schemas are defined in components/schemas
  # so that codegen preserves the TypeScript types.

components:
  parameters:
    AuthorizationSessionHeader:
      name: Authorization
      in: header
      required: false
      description: Opaque session token — `Bearer <sid>`.
      schema:
        type: string
    SessionCookie:
      name: sid
      in: cookie
      required: false
      description: Browser session cookie.
      schema:
        type: string
  schemas:
    AuthUser:
      type: object
      required: [id, email, firstName, lastName, profileImageUrl]
      properties:
        id:
          type: string
        email:
          type: [string, 'null']
          format: email
        firstName:
          type: [string, 'null']
        lastName:
          type: [string, 'null']
        profileImageUrl:
          type: [string, 'null']
    AuthUserEnvelope:
      type: object
      required: [user]
      properties:
        user:
          oneOf:
            - $ref: '#/components/schemas/AuthUser'
            - type: 'null'
    MobileTokenExchangeRequest:
      type: object
      required: [code, code_verifier, redirect_uri, state]
      properties:
        code:
          type: string
          minLength: 1
        code_verifier:
          type: string
          minLength: 1
        redirect_uri:
          type: string
          minLength: 1
          format: uri
        state:
          type: string
          minLength: 1
        nonce:
          type: string
          minLength: 1
    MobileTokenExchangeSuccess:
      type: object
      required: [token]
      properties:
        token:
          type: string
    LogoutSuccess:
      type: object
      required: [success]
      properties:
        success:
          type: boolean
          const: true
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: string
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]

    Client:
      type: object
      additionalProperties: true
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
          nullable: true
        phone:
          type: string
          nullable: true
        address:
          type: string
          nullable: true
        city:
          type: string
          nullable: true
        state:
          type: string
          nullable: true
        zip:
          type: string
          nullable: true
        notes:
          type: string
          nullable: true
        businessLine: { type: string, nullable: true }
        sourceBusinessId: { type: integer }
        sourceBusinessLine: { type: string }
        nextServiceDate: { type: string, nullable: true }
        squareCustomerId: { type: string, nullable: true }
        reminderOptOut:
          type: boolean
        mileageSurchargeEnabled:
          type: boolean
        mileageSurchargeTriggerMiles:
          type: number
          nullable: true
        mileageSurchargeDailyRate:
          type: number
          nullable: true
        createdAt:
          type: string
      required: [id, name, createdAt]

    CreateClientRequest:
      type: object
      additionalProperties: true
      properties:
        name:
          type: string
        email:
          type: string
          nullable: true
        phone:
          type: string
          nullable: true
        address:
          type: string
          nullable: true
        city:
          type: string
          nullable: true
        state:
          type: string
          nullable: true
        zip:
          type: string
          nullable: true
        notes:
          type: string
          nullable: true
        businessLine: { type: string, nullable: true }
        nextServiceDate: { type: string, nullable: true }
        serviceIntervalMonths: { type: integer, nullable: true }
        reminderOptOut:
          type: boolean
        mileageSurchargeEnabled:
          type: boolean
        mileageSurchargeTriggerMiles:
          type: number
          nullable: true
        mileageSurchargeDailyRate:
          type: number
          nullable: true
      required: [name]

    Job:
      type: object
      additionalProperties: true
      properties:
        id:
          type: integer
        title:
          type: string
        description:
          type: string
          nullable: true
        clientId:
          type: integer
          nullable: true
        clientName:
          type: string
          nullable: true
        subcontractorIds:
          type: array
          items:
            type: integer
        subcontractorNames:
          type: array
          items:
            type: string
        status:
          type: string
          enum: [scheduled, in_progress, awaiting_approval, completed, invoiced, cancelled, closed]
        jobType:
          type: string
          nullable: true
        address:
          type: string
          nullable: true
        city:
          type: string
          nullable: true
        state:
          type: string
          nullable: true
        locationName:
          type: string
          nullable: true
        startDate:
          type: string
          nullable: true
        endDate:
          type: string
          nullable: true
        notes:
          type: string
          nullable: true
        businessLine:
          type: string
          nullable: true
        businessId: { type: integer, nullable: true }
        workflow: { type: string, nullable: true }
        planningState:
          type: string
          enum: [ready, scheduled, waiting, queue]
        priority:
          type: string
          enum: [urgent, high, normal, low]
        resourceDemand:
          type: string
          enum: [standard, large_crew, all_hands]
        queuePosition:
          type: integer
          nullable: true
        subPaid:
          type: boolean
        includeMileageInJobCosts: { type: boolean }
        sqFt:
          type: integer
          nullable: true
        coats:
          type: integer
          nullable: true
        phases:
          type: array
          nullable: true
          items:
            $ref: "#/components/schemas/PhaseItem"
        serviceBilling:
          $ref: "#/components/schemas/ServiceBilling"
          nullable: true
        permitChecklist: { type: object, nullable: true, additionalProperties: true }
        mfhManufacturerId: { type: integer, nullable: true }
        mfhModelId: { type: integer, nullable: true }
        mfhManufacturerName: { type: string, nullable: true }
        mfhModelName: { type: string, nullable: true }
        mfhModelYear: { type: integer, nullable: true }
        mfhConstructionType: { type: string, nullable: true }
        mhProductionServices: { type: array, nullable: true, items: { type: integer } }
        productionComponents:
          type: array
          items:
            $ref: "#/components/schemas/ProductionComponent"
        manHours: { type: number, nullable: true }
        homeModel: { type: string, nullable: true }
        jobNumber: { type: string, nullable: true }
        closedAt: { type: string, nullable: true }
        createdAt:
          type: string
      required: [id, title, status, createdAt]

    StartJobRequest:
      type: object
      properties:
        startDate: { type: string, format: date }
      required: [startDate]

    ReadyToStartJob:
      allOf:
        - $ref: "#/components/schemas/Job"
        - type: object
          properties:
            productionComponents:
              type: array
              items:
                $ref: "#/components/schemas/ProductionComponent"
            activeReadinessCondition:
              allOf:
                - $ref: "#/components/schemas/JobReadinessCondition"
              nullable: true
