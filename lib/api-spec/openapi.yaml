        - productionComponentId
        - componentInstanceKey
        - componentKey
        - componentLabel
        - variant
        - snapshotVersion
        - workerName
        - linkedSubcontractorId
        - workDate
        - actualHours
        - notes
        - createdAt
        - updatedAt

