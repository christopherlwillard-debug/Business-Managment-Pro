        - jobId
        - businessId
        - componentKey
        - componentInstanceKey
        - componentLabel
        - variant
        - sourceServiceIds
        - sourceServices
        - snapshotVersion
        - status
        - expectedLaborHours
        - expectedDurationDays
        - expectedCrewSize
        - checklistContext
        - materialContext
        - pricingContext
        - knowledgeContext
        - capturedAt
        - supersededAt
        - persisted
        - previousSnapshotVersion
        - changesFromPrevious

    UpdateProductionComponentStatusRequest:
      type: object
      properties:
        componentInstanceKey: { type: string }
        status:
          type: string
          enum: [planned, in_progress, paused, completed, not_applicable]
        expectedDurationDays:
          type: integer
          nullable: true
          minimum: 1
      required: [componentInstanceKey]

    CreateComponentWorkSessionRequest:
      type: object
      additionalProperties: false
      properties:
        productionComponentId: { type: integer }
        workDate:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
        linkedSubcontractorId: { type: integer, nullable: true }
        workerName: { type: string, minLength: 1, maxLength: 160 }
        actualHours:
          type: string
          pattern: '^(?:0|[1-9]|1[0-9]|2[0-4])(?:\.[0-9]{1,2})?$'
        notes: { type: string, nullable: true, maxLength: 2000 }
      required: [productionComponentId, workDate, actualHours]

    UpdateComponentWorkSessionRequest:
      type: object
      additionalProperties: false
      properties:
        workDate:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
        linkedSubcontractorId: { type: integer, nullable: true }
        workerName: { type: string, nullable: true, maxLength: 160 }
        actualHours:
          type: string
          pattern: '^(?:0|[1-9]|1[0-9]|2[0-4])(?:\.[0-9]{1,2})?$'
        notes: { type: string, nullable: true, maxLength: 2000 }

