        componentLabel: { type: string }
        variant: { type: string, nullable: true, enum: [vog, hybrid, drywall] }
        snapshotVersion: { type: integer }
        workerName: { type: string }
        linkedSubcontractorId: { type: integer, nullable: true }
        workDate:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
        actualHours:
          type: string
          pattern: '^\d+\.\d{2}$'
        notes: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
      required:
