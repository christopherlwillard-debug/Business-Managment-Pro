kind = "web"
previewPath = "/public-website/"
title = "Willard's General Contracting - Public Website"
version = "1.0.0"
id = "artifacts/public-website"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/public-website/" ]
localPort = 20711

[services.development]
run = "pnpm --filter @workspace/public-website run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/public-website", "run", "build" ]
publicDir = "artifacts/public-website/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20711"
BASE_PATH = "/public-website/"
