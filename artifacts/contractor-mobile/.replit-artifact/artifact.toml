kind = "mobile"
previewPath = "/contractor-mobile/"
title = "BuildPro Mobile"
version = "1.0.0"
id = "artifacts/contractor-mobile"
router = "expo-domain"

[[integratedSkills]]
name = "expo"
version = "1.0.0"

[[services]]
ensurePreviewReachable = "/status"
name = "expo"
paths = [ "/contractor-mobile/" ]
localPort = 23559

[services.development]
run = "pnpm --filter @workspace/contractor-mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/contractor-mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/contractor-mobile", "run", "serve" ]

[services.env]
PORT = "23559"
BASE_PATH = "/contractor-mobile/"
