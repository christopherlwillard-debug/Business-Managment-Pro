name: Audit branch validation

on:
  pull_request:
    branches: [master]
  push:
    branches:
      - "audit/**"

permissions:
  contents: read

concurrency:
  group: audit-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run API tests
        run: pnpm --filter @workspace/api-server exec vitest run

      - name: Run contractor app tests
        run: pnpm --filter @workspace/contractor-app test

      - name: Run typecheck and production builds
        run: pnpm run build
