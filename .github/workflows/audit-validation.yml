name: Audit branch validation

on:
  pull_request:
    branches: [master]
  push:
    branches:
      - "audit/**"

permissions:
  contents: read

concurrency:
  group: audit-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # These focused regression tests mock storage/database and do not need
      # production credentials or a live PostgreSQL instance.
      - name: Run audit regression tests
        run: pnpm --filter @workspace/api-server run test:audit-regressions

      # Run frontend tests separately so an API test failure does not hide them.
      - name: Run contractor app tests
        run: pnpm --filter @workspace/contractor-app test

      - name: Run typechecks
        run: pnpm run typecheck

      - name: Run production builds
        run: pnpm -r --if-present run build
